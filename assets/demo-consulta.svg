<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Demo animada da Consulta de Produtos com dados fictícios</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3554"/><stop offset="1" stop-color="#000f22"/></linearGradient>
<radialGradient id="r" cx=".5" cy="0" r=".8"><stop offset="0" stop-color="#3f6593" stop-opacity=".9"/><stop offset="1" stop-color="#3f6593" stop-opacity="0"/></radialGradient></defs>
<style>
.s{opacity:0}
.s1{animation:o1 12s infinite}.s2{animation:o2 12s infinite}.s3{animation:o3 12s infinite}
