.cur{animation:cu 12s infinite}
@keyframes cu{0%,66%{opacity:0}78%,92%{opacity:1}100%{opacity:0}}
.w{fill:#fff}.m{fill:#80aad3}.l{fill:#c0e6fd}
</style>
