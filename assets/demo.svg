<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Demo animada do Painel Financeiro com dados fictícios</title>
<style>
.t{fill:#000f22}.m{fill:#3f6593}.w{fill:#fff}.l{fill:#c0e6fd}.neg{fill:#a13a4a}.pos{fill:#2f7a5f}
.v{opacity:0}
.va{animation:fa 12s infinite}.vb{animation:fb 12s infinite}
@keyframes fa{0%{opacity:0}3%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes fb{0%,50%{opacity:0}53%,95%{opacity:1}100%{opacity:0}}
.ba{transform-box:fill-box;transform-origin:50% 100%;animation:ga 12s infinite}
.bb{transform-box:fill-box;transform-origin:50% 100%;animation:gb 12s infinite}
@keyframes ga{0%{transform:scaleY(.03)}12%,100%{transform:scaleY(1)}}
@keyframes gb{0%,50%{transform:scaleY(.03)}62%,100%{transform:scaleY(1)}}
.ma{animation:wa 12s infinite}.mb{animation:wb 12s infinite}
@keyframes wa{0%{transform:scaleX(.02)}14%,100%{transform:scaleX(1)}}
@keyframes wb{0%,50%{transform:scaleX(.02)}64%,100%{transform:scaleX(1)}}
.ma,.mb{transform-box:fill-box;transform-origin:0 50%}
.na{animation:na 12s infinite}.nb{animation:nb 12s infinite}
@keyframes na{0%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes nb{0%,50%{opacity:0}53%,95%{opacity:1}100%{opacity:0}}
</style>
